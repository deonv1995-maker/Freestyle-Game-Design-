<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Freestyle Game Design — Spear Relay</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main class="game-shell">
    <canvas id="gameCanvas" aria-label="Spear Relay prototype game area"></canvas>

    <section class="hud" aria-live="polite">
      <div class="hud-copy">
        <strong id="status">READY</strong>
        <span id="hint">Hold anywhere, slide to aim, release to throw.</span>
      </div>
      <button id="resetButton" type="button">Reset</button>
    </section>

    <div class="prototype-tag" aria-hidden="true">SPEAR RELAY · PROTOTYPE 0.1</div>
  </main>

  <script type="module" src="./src/game.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Freestyle Game Design — Energy Relay</title>
  <link rel="manifest" href="./site.webmanifest">
  <link rel="icon" href="./assets/branding/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main class="game-shell">
    <canvas id="gameCanvas" aria-label="Energy Relay prototype game area"></canvas>

    <section class="hud" aria-live="polite">
      <div class="hud-copy">
        <strong id="status">ORB READY</strong>
        <span id="hint">Launch the orb, keep bouncing, and survive the hazard corridor.</span>
      </div>
      <button id="resetButton" type="button">Reset</button>
    </section>

    <div class="prototype-tag" aria-hidden="true">ENERGY RELAY · PROTOTYPE 0.11</div>
  </main>

  <script type="module" src="./src/game.js"></script>
</body>
</html>

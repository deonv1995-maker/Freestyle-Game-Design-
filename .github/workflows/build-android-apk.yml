name: Build Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "assets/**"
      - "tests/**"
      - "scripts/**"
      - "index.html"
      - "privacy.html"
      - "site.webmanifest"
      - "package.json"
      - ".github/workflows/build-android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "assets/**"
      - "tests/**"
      - "scripts/**"
      - "index.html"
      - "privacy.html"
      - "site.webmanifest"
      - "package.json"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Verify and build game
        run: npm run check

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Prepare optional Play upload signing
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/energy-relay-upload.jks"
            printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          fi

      - name: Build test APK and release app bundle
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon -p android :app:assembleDebug :app:bundleRelease

      - name: Verify Android outputs
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"
          test "$(apkanalyzer manifest application-id "$APK")" = "com.freestylegamedesign.spearrelay"
          unzip -t "$AAB" >/dev/null
          unzip -l "$AAB" | grep -q "base/assets/index.html"
          unzip -p "$AAB" base/dex/classes.dex > "$RUNNER_TEMP/release-classes.dex"
          if strings "$RUNNER_TEMP/release-classes.dex" | grep -Eq "OnBackInvoked|WindowInsetsController|WindowInsets\\$Type"; then
            echo "Release DEX contains platform-only startup APIs above minSdk 26."
            exit 1
          fi
          mkdir -p release
          cp "$APK" release/Energy-Relay.apk
          cp "$AAB" release/Energy-Relay-release.aab

      - uses: actions/upload-artifact@v6
        with:
          name: Energy-Relay-Android
          path: |
            release/Energy-Relay.apk
            release/Energy-Relay-release.aab
          if-no-files-found: error

      - name: Publish phone-download release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/Energy-Relay.apk \
            --target "$GITHUB_SHA" \
            --title "Energy Relay Android Test #${GITHUB_RUN_NUMBER}" \
            --notes "Installable Android test build generated from commit $GITHUB_SHA."

plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.freestylegamedesign.spearrelay'
    compileSdk 35

    defaultConfig {
        applicationId 'com.freestylegamedesign.spearrelay'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "0.1.${buildNumber}"
    }

    signingConfigs {
        test {
            storeFile rootProject.file('keys/spear-relay-test.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.test
            debuggable true
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            assets.srcDirs = [rootProject.file('../dist')]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

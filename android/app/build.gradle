import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

def packageMetadata = new JsonSlurper().parse(rootProject.file('../package.json'))
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
def uploadKeystorePath = System.getenv("ANDROID_UPLOAD_KEYSTORE_PATH")
def uploadStorePassword = System.getenv("ANDROID_UPLOAD_STORE_PASSWORD")
def uploadKeyAlias = System.getenv("ANDROID_UPLOAD_KEY_ALIAS")
def uploadKeyPassword = System.getenv("ANDROID_UPLOAD_KEY_PASSWORD")
def hasUploadSigning =
    uploadKeystorePath &&
    uploadStorePassword &&
    uploadKeyAlias &&
    uploadKeyPassword

android {
    namespace 'com.freestylegamedesign.spearrelay'
    compileSdk 36

    defaultConfig {
        applicationId 'com.freestylegamedesign.spearrelay'
        minSdk 26
        targetSdk 36
        versionCode buildNumber
        versionName packageMetadata.version as String
    }

    signingConfigs {
        test {
            storeFile rootProject.file('keys/spear-relay-test.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        if (hasUploadSigning) {
            release {
                storeFile file(uploadKeystorePath)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.test
            debuggable true
            minifyEnabled false
        }

        release {
            if (hasUploadSigning) {
                signingConfig signingConfigs.release
            }
            debuggable false
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            assets.srcDirs = [rootProject.file('../dist')]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
